<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OmniChat">
    <meta name="theme-color" content="#26221d">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Omnichannel Chat Inbox</title>
    <!-- FontAwesome & Sarabun Font -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --line-green: #588157;        /* Warm Sage Green (สบายตา ละมุน ไม่แยงตา) */
            --line-green-hover: #486d47;  /* Deeper Sage */
            --bg-dark: #1b1916;           /* Warm Espresso / Stone (มืดแบบอุ่น สบายตา) */
            --bg-header: #26221d;         /* Warm Stone Taupe */
            --bg-card: #2f2a23;           /* Warm Sandstone */
            --bg-bubble-in: #353028;      /* Warm Pebble Stone (กล่องข้อความลูกค้า) */
            --text-main: #f5ede2;         /* Warm Cream Linen (ตัดแสงสีฟ้า ถนอมสายตา) */
            --text-muted: #a69b8d;        /* Soft Warm Almond */
            --border-line: #3b352b;       /* Soft Earthy Border */
            --earth-sand: #c89565;        /* Warm Terracotta / Sand */
        }

        /* Sleek Earth-tone Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-line); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5c5344; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);

            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* =================== DESKTOP LAYOUT =================== */
        .sidebar {
            width: 360px;
            background-color: var(--bg-header);
            border-right: 1px solid var(--border-line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            z-index: 10;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            height: 100%;
            position: relative;
            z-index: 20;
        }

        .crm-panel {
            width: 300px;
            background-color: var(--bg-header);
            border-left: 1px solid var(--border-line);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            overflow-y: auto;
        }

        /* =================== SIDEBAR (CHAT LIST) =================== */
        .sidebar-header {
            padding: 14px 16px;
            padding-top: max(16px, calc(env(safe-area-inset-top, 0px) + 12px));
            border-bottom: 1px solid var(--border-line);
            background: var(--bg-header);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-count {
            background: var(--line-green);
            color: white;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-line);
            color: var(--text-muted);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh:active { background: rgba(255, 255, 255, 0.15); }

        .btn-whatsapp {
            background: rgba(88, 129, 87, 0.14);
            border: 1px solid rgba(88, 129, 87, 0.38);
            color: #8cb88b;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 11px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-whatsapp:hover {
            background: rgba(88, 129, 87, 0.25);
            border-color: #8cb88b;
        }


        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-line);
            color: var(--text-main);
            font-size: 13px;
            padding: 9px 12px 9px 34px;
            border-radius: 10px;
            outline: none;
        }
        .search-box input:focus { border-color: var(--line-green); }

        .search-box i {
            position: absolute;
            left: 11px;
            top: 11px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-tab {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .filter-tab.active {
            background: var(--line-green);
            color: #fff;
            border-color: var(--line-green);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s;
        }

        .chat-item:active, .chat-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .chat-item.active {
            background: rgba(88, 129, 87, 0.15);
            border-left: 4px solid var(--line-green);
        }


        .avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-line);
            background: #1e293b;
        }

        .avatar-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 0 0 2px var(--bg-header);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 14.5px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .channel-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            margin-bottom: 3px;
        }

        .chat-last-msg {
            font-size: 12.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =================== CHAT ROOM (LINE STYLE) =================== */
        .chat-header {
            /* Safe area padding to keep header below Dynamic Island / Notch */
            padding-top: max(14px, calc(env(safe-area-inset-top, 0px) + 12px));
            padding-bottom: 12px;
            padding-left: 12px;
            padding-right: 14px;
            border-bottom: 1px solid var(--border-line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-header);
            flex-shrink: 0;
            z-index: 30;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        /* Large touch-friendly Back Button */
        .btn-back {
            display: none;
            background: transparent;
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 20px;
            margin-left: -6px;
        }
        .btn-back:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .header-customer {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .customer-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .customer-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .customer-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-line);
            color: #cbd5e1;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-header-icon:active { background: rgba(255, 255, 255, 0.2); }

        /* LINE Messages Bubble Style */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
            background-color: var(--bg-dark);
        }

        .msg-row {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        /* Customer Message (Left) */
        .msg-row.customer {
            justify-content: flex-start;
            align-items: flex-end;
        }

        .msg-row.customer .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-line);
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .msg-bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .msg-customer-name {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
            margin-left: 2px;
        }

        .msg-content-flex {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        .msg-row.customer .msg-bubble {
            background: var(--bg-bubble-in);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Agent Message (Right) - LINE GREEN */
        .msg-row.agent {
            justify-content: flex-end;
            align-items: flex-end;
        }

        .msg-row.agent .msg-content-flex {
            flex-direction: row-reverse;
        }

        .msg-row.agent .msg-bubble {
            background: var(--line-green);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .msg-meta {
            font-size: 10.5px;
            color: #64748b;
            white-space: nowrap;
            line-height: 1;
            margin-bottom: 3px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .msg-read-status {
            color: var(--line-green);
            font-size: 9.5px;
            font-weight: 600;
        }

        /* LINE Chat Input Footer */
        .chat-footer {
            padding: 10px 12px;
            padding-bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) + 8px));
            border-top: 1px solid var(--border-line);
            background: var(--bg-header);
            flex-shrink: 0;
            z-index: 30;
        }

        .input-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-form input {
            flex: 1;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-line);
            color: white;
            padding: 11px 16px;
            border-radius: 22px;
            font-size: 14.5px;
            outline: none;
        }
        .input-form input:focus {
            border-color: var(--line-green);
        }

        .btn-send {
            background: var(--line-green);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .btn-send:hover { background: var(--line-green-hover); }
        .btn-send:active { transform: scale(0.92); }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            text-align: center;
            gap: 12px;
            padding: 20px;
        }

        /* =================== MODAL / CRM =================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            backdrop-filter: blur(5px);
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            background: var(--bg-header);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 22px 20px;
            padding-bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 16px));
            border-top: 1px solid var(--border-line);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            animation: slideUp 0.22s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-modal {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =================== MOBILE SPECIFIC RULES (< 768px) =================== */
        @media (max-width: 768px) {
            .sidebar {
                width: 100% !important;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                transition: transform 0.22s ease-out;
            }
            .main-chat {
                width: 100% !important;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                transform: translateX(100%);
                transition: transform 0.22s ease-out;
            }
            body.in-chat-mobile .sidebar {
                transform: translateX(-25%);
            }
            body.in-chat-mobile .main-chat {
                transform: translateX(0);
            }
            .btn-back {
                display: flex !important;
            }
            .crm-panel {
                display: none !important;
            }
            .btn-info-mobile {
                display: flex !important;
            }
            .customer-title {
            .header-top {
                flex-wrap: wrap;
                gap: 8px;
            }
            .header-actions {
                display: flex;
                gap: 6px;
                width: 100%;
                justify-content: space-between;
            }
            .header-actions button {
                flex: 1;
                justify-content: center;
                padding: 7px 4px !important;
                font-size: 11.5px !important;
            }
            .filter-tabs {
                padding-bottom: 2px;
            }
        }

        @media (min-width: 769px) {
            .btn-info-mobile {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Left Chat List Sidebar -->
    <div class="sidebar" id="sidebar-panel">
        <div class="sidebar-header">
            <div class="header-top">
                <div class="header-title">
                    <i class="fa-solid fa-comments" style="color: var(--line-green);"></i>
                    กล่องแชทรวม
                    <span id="badge-total" class="badge-count">0</span>
                </div>
                <div class="header-actions">
                    <button id="btn-notify-perm" class="btn-refresh" onclick="enableNotifications()" title="เปิดการแจ้งเตือนเสียงและหน้าจอ" style="background:rgba(200, 149, 101, 0.15); color:var(--earth-sand); border:1px solid rgba(200, 149, 101, 0.3);">
                        <i class="fa-solid fa-bell"></i> แจ้งเตือน
                    </button>
                    <button class="btn-whatsapp" onclick="openWhatsAppModal()" id="btn-wa-status" title="เชื่อมต่อ WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        <span id="wa-status-dot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#94a3b8;"></span>
                    </button>
                    <button class="btn-refresh" onclick="loadData()">
                        <i class="fa-solid fa-rotate-right"></i> รีเฟรช
                    </button>
                </div>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" oninput="renderChats()" placeholder="ค้นหาชื่อลูกค้า...">
            </div>
            
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="setFilter('all', this)">ทั้งหมด</button>
                <button class="filter-tab" onclick="setFilter('line-1', this)">🟢 Alphard (LINE)</button>
                <button class="filter-tab" onclick="setFilter('line-2', this)">🔵 Bangkokalphard (LINE)</button>
                <button class="filter-tab" onclick="setFilter('fb-alphard', this)">📘 Alphard (FB)</button>
                <button class="filter-tab" onclick="setFilter('fb-sclass', this)">🔷 Sclass (FB)</button>
                <button class="filter-tab" onclick="setFilter('ig-alphard', this)">📸 Alphard (IG)</button>
                <button class="filter-tab" onclick="setFilter('ig-sclass', this)">📸 Sclass (IG)</button>
                <button class="filter-tab" onclick="setFilter('whatsapp', this)">🟢 WhatsApp</button>
            </div>

        </div>
        
        <div id="chat-list-el" class="chat-list">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- 2. Main Chat Box (LINE Style) -->
    <div class="main-chat" id="chat-panel">
        <div class="chat-header">
            <div class="header-left">
                <!-- Mobile LINE Back Button (Large & Safe from Notch) -->
                <button class="btn-back" onclick="goBackToList()" title="ย้อนกลับ">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                
                <div class="header-customer" onclick="openCrmModal()">
                    <img id="header-avatar" src="https://via.placeholder.com/100" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid var(--border-line);">
                    <div style="min-width:0;">
                        <div class="customer-title-row">
                            <span id="header-name" class="customer-title">เลือกลูกค้า</span>
                        </div>
                        <div id="header-sub" class="customer-sub">ช่องทาง: -</div>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <!-- Pin button -->
                <button id="btn-header-pin" class="btn-header-icon" onclick="togglePinActiveChat()" title="ปักหมุดแชทนี้">
                    <i class="fa-solid fa-thumbtack"></i>
                </button>
                <!-- Rename button -->
                <button class="btn-header-icon" onclick="promptEditName()" title="แก้ไขชื่อลูกค้า">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <!-- Delete chat button -->
                <button class="btn-header-icon" onclick="deleteActiveChat()" title="ลบห้องแชทนี้" style="color: #f87171;">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <!-- Info / CRM button -->
                <button class="btn-header-icon" onclick="openCrmModal()" title="ข้อมูลลูกค้า">
                    <i class="fa-solid fa-circle-info"></i>
                </button>
            </div>
        </div>
        
        <div id="messages-container" class="chat-messages">
            <div class="empty-state">
                <i class="fa-regular fa-comment-dots" style="font-size:48px; margin-bottom:8px; color:#475569;"></i>
                <div>เลือกลูกค้าจากรายการเพื่อเริ่มตอบแชท</div>
            </div>
        </div>
        
        <div class="chat-footer">
            <form class="input-form" onsubmit="sendMessage(event)">
                <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
                <button type="submit" class="btn-send" title="ส่งข้อความ">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 3. Desktop Right CRM info -->
    <div class="crm-panel">
        <div style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:16px; letter-spacing:0.5px;">ข้อมูลลูกค้า (CRM Info)</div>
        <div style="text-align:center; padding-bottom:18px; border-bottom:1px solid var(--border-line);">
            <img id="crm-avatar" src="https://via.placeholder.com/100" style="width:72px; height:72px; border-radius:50%; object-fit:cover; border:2px solid var(--line-green); margin-bottom:10px;">
            <div id="crm-name" style="font-size:16px; font-weight:700; color:white;">-</div>
            <div id="crm-channel" style="font-size:12px; color:var(--text-muted); margin-top:4px;">-</div>
        </div>
        
        <div style="margin-top:16px;">
            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:600;">ชื่อลูกค้า (แก้ไขได้)</label>
            <div style="display:flex; gap:6px;">
                <input type="text" id="edit-customer-name" placeholder="พิมพ์ชื่อลูกค้า..." onkeydown="if(event.key==='Enter'){saveCustomerName(); event.preventDefault();}" style="flex:1; min-width:0; background:rgba(0,0,0,0.3); border:1px solid var(--border-line); color:white; padding:8px 10px; border-radius:8px; font-size:13px; outline:none;">
                <button onclick="saveCustomerName()" style="background:var(--line-green); color:white; border:none; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0;">บันทึก</button>
            </div>
        </div>
        
        <div style="margin-top:16px;">
            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:600;">รหัสลูกค้า (User ID)</label>
            <div id="crm-uid" style="font-size:11px; background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; border:1px solid var(--border-line); color:#cbd5e1; word-break:break-all;">-</div>
        </div>

        <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border-line);">
            <button onclick="deleteActiveChat()" style="width:100%; background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.3); padding:9px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;">
                <i class="fa-solid fa-trash-can"></i> ลบห้องแชทนี้
            </button>
        </div>
    </div>

    <!-- 4. Mobile Bottom Sheet for CRM (LINE Style Sheet) -->
    <div id="crm-modal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-address-card" style="color:var(--line-green);"></i> ข้อมูลลูกค้า
                </div>
                <button class="btn-close-modal" onclick="closeCrmModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border-line);">
                <img id="m-crm-avatar" src="https://via.placeholder.com/100" style="width:58px; height:58px; border-radius:50%; object-fit:cover; border:2px solid var(--line-green);">
                <div>
                    <div id="m-crm-name" style="font-size:16px; font-weight:700; color:white;">-</div>
                    <div id="m-crm-channel" style="font-size:12px; color:var(--text-muted); margin-top:3px;">-</div>
                </div>
            </div>
            <div style="margin-bottom:18px;">
                <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:600;">ชื่อลูกค้า / โน้ตกำกับ</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="m-edit-customer-name" placeholder="พิมพ์ชื่อลูกค้า..." style="flex:1; background:rgba(0,0,0,0.3); border:1px solid var(--border-line); color:white; padding:10px 14px; border-radius:12px; font-size:14px; outline:none;">
                    <button onclick="saveMobileCustomerName()" style="background:var(--line-green); color:white; border:none; padding:10px 18px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer;">บันทึก</button>
                </div>
            </div>
            <div>
                <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:600;">รหัสลูกค้า (User ID)</label>
                <div id="m-crm-uid" style="font-size:11.5px; background:rgba(0,0,0,0.3); padding:12px; border-radius:10px; border:1px solid var(--border-line); color:#cbd5e1; word-break:break-all;">-</div>
            </div>
            <div style="margin-top:18px;">
                <button onclick="deleteActiveChat()" style="width:100%; background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.3); padding:11px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;">
                    <i class="fa-solid fa-trash-can"></i> ลบห้องแชทนี้
                </button>
            </div>
        </div>
    </div>

    <!-- 5. WhatsApp Connection QR Modal -->
    <div id="wa-modal" class="modal-overlay" onclick="closeWaModalOnBackdrop(event)">
        <div class="modal-sheet" style="max-width: 440px; text-align: center;">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-brands fa-whatsapp" style="color:#25D366; font-size: 22px;"></i> เชื่อมต่อ WhatsApp
                </div>
                <button class="btn-close-modal" onclick="closeWhatsAppModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="wa-modal-body" style="padding: 10px 0;">
                <!-- Content dynamically populated -->
            </div>
        </div>
    </div>


    <script>
        let allConversations = [];
        let activeConvId = null;
        let currentFilter = 'all';

        const isMobile = () => window.innerWidth <= 768;

        async function loadData() {
            try {
                const res = await fetch('/api/conversations');
                allConversations = await res.json();
                
                // On desktop: auto select first chat if none selected
                if (!isMobile() && allConversations.length > 0 && !activeConvId) {
                    activeConvId = allConversations[0].id;
                }
                renderChats();
                renderMessages();
            } catch (err) {
                console.error('Error fetching data:', err);
            }
        }

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderChats();
        }

        function formatConvTime(c) {
            if (c.last_activity_timestamp && c.last_activity_timestamp > 0) {
                const d = new Date(c.last_activity_timestamp * 1000);
                return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
            }
            return formatMsgTime(c.updated_at || '');
        }

        function formatMsgTime(timeStr) {
            if (!timeStr) return '';
            const parts = timeStr.split(':');
            if (parts.length === 2) {
                let h = parseInt(parts[0], 10);
                let min = parts[1];
                if (!isNaN(h)) {
                    if (["04", "06", "07"].includes(parts[0])) {
                        h = (h + 7) % 24;
                        return `${h < 10 ? '0' : ''}${h}:${min}`;
                    }
                }
            }
            return timeStr;
        }

        function renderChats() {
            const listEl = document.getElementById('chat-list-el');
            const searchKeyword = (document.getElementById('search-input').value || '').toLowerCase();
            
            const filtered = allConversations.filter(c => {
                const matchFilter = currentFilter === 'all' || c.channel_id === currentFilter;
                const matchSearch = (c.customer_name || '').toLowerCase().includes(searchKeyword);
                return matchFilter && matchSearch;
            });

            document.getElementById('badge-total').innerText = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding:40px; text-align:center; color:#64748b; font-size:13px;">ไม่พบรายการแชท</div>';
                return;
            }

            listEl.innerHTML = filtered.map(c => {
                const isActive = c.id === activeConvId;
                const isPinned = !!c.is_pinned;
                const lastMsg = c.messages && c.messages.length > 0 ? c.messages[c.messages.length - 1].text : 'ไม่มีข้อความ';
                const isFb = c.platform === 'facebook' || (c.channel_id && c.channel_id.startsWith('fb'));
                const isIg = c.platform === 'instagram' || (c.channel_id && c.channel_id.startsWith('ig'));
                const isWa = c.platform === 'whatsapp' || c.channel_id === 'whatsapp';
                const channelColor = c.channel_color || (isIg ? '#c06c84' : (isWa ? '#4f7d5e' : (isFb ? '#43617e' : '#588157')));
                const channelName = c.channel_name || (isIg ? 'Instagram' : (isWa ? 'WhatsApp' : (isFb ? 'Facebook' : 'LINE OA')));
                let iconClass = 'fa-brands fa-line';
                if (isIg) iconClass = 'fa-brands fa-instagram';
                else if (isFb) iconClass = 'fa-brands fa-facebook-messenger';
                else if (isWa) iconClass = 'fa-brands fa-whatsapp';
                const pinIcon = isPinned ? `<span style="color:var(--earth-sand); margin-left:6px; font-size:10px;" title="ปักหมุดแล้ว"><i class="fa-solid fa-thumbtack"></i></span>` : '';
                
                return `
                    <div class="chat-item ${isActive ? 'active' : ''} ${isPinned ? 'pinned' : ''}" onclick="selectChat('${c.id}')" style="${isPinned && !isActive ? 'background:rgba(200, 149, 101, 0.05);' : ''}">

                        <div class="avatar-wrap">
                            <img class="avatar" src="${c.customer_avatar || 'https://via.placeholder.com/100'}">
                            <div class="avatar-badge" style="background:${channelColor};">
                                <i class="${iconClass}"></i>
                            </div>
                        </div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">${escapeHtml(c.customer_name)}${pinIcon}</span>
                                <span class="chat-time">${formatConvTime(c)}</span>
                            </div>
                            <span class="channel-tag" style="background:${channelColor};">${channelName}</span>
                            <div class="chat-last-msg">${escapeHtml(lastMsg)}</div>
                        </div>
                    </div>
                `;
            }).join('');

        }

        function selectChat(id) {
            activeConvId = id;
            if (isMobile()) {
                document.body.classList.add('in-chat-mobile');
            }
            renderChats();
            renderMessages();
        }

        function goBackToList() {
            document.body.classList.remove('in-chat-mobile');
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        }

        // Swipe right from left edge to go back (iOS / LINE Gesture)
        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = Math.abs(touchEndY - touchStartY);

            // If swiped right from left edge (>70px, mostly horizontal)
            if (touchStartX < 50 && diffX > 70 && diffY < 50 && isMobile() && document.body.classList.contains('in-chat-mobile')) {
                goBackToList();
            }
        }, { passive: true });

        function renderMessages() {
            const conv = allConversations.find(c => c.id === activeConvId);
            const container = document.getElementById('messages-container');
            
            if (!conv) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-comment-dots" style="font-size:48px; color:#475569;"></i>
                        <div>เลือกลูกค้าจากรายการเพื่อเริ่มตอบแชท</div>
                    </div>
                `;
                return;
            }

            // Update Header
            const chName = conv.channel_name || (conv.platform === 'instagram' ? 'Instagram' : (conv.platform === 'whatsapp' ? 'WhatsApp' : (conv.platform === 'facebook' ? 'Facebook' : 'LINE OA')));
            document.getElementById('header-avatar').src = conv.customer_avatar || 'https://via.placeholder.com/100';
            document.getElementById('header-name').innerText = conv.customer_name;
            document.getElementById('header-sub').innerText = `ช่องทาง: ${chName}`;

            // Update Pin Button in Header
            const btnPin = document.getElementById('btn-header-pin');
            if (btnPin) {
                if (conv.is_pinned) {
                    btnPin.style.color = 'var(--line-green)';
                    btnPin.style.background = 'rgba(6, 199, 85, 0.2)';
                    btnPin.title = 'ยกเลิกปักหมุดแชท';
                } else {
                    btnPin.style.color = '#cbd5e1';
                    btnPin.style.background = 'rgba(255, 255, 255, 0.08)';
                    btnPin.title = 'ปักหมุดแชทนี้';
                }
            }

            // Update Desktop CRM
            document.getElementById('crm-avatar').src = conv.customer_avatar || 'https://via.placeholder.com/100';
            document.getElementById('crm-name').innerText = conv.customer_name;
            document.getElementById('crm-channel').innerText = chName;
            document.getElementById('crm-uid').innerText = conv.platform_user_id || '-';
            const editNameInput = document.getElementById('edit-customer-name');
            if (editNameInput) editNameInput.value = conv.customer_name || '';

            // Update Mobile Modal CRM
            document.getElementById('m-crm-avatar').src = conv.customer_avatar || 'https://via.placeholder.com/100';
            document.getElementById('m-crm-name').innerText = conv.customer_name;
            document.getElementById('m-crm-channel').innerText = chName;

            document.getElementById('m-crm-uid').innerText = conv.platform_user_id || '-';
            const mEditNameInput = document.getElementById('m-edit-customer-name');
            if (mEditNameInput) mEditNameInput.value = conv.customer_name || '';

            // Render Messages in LINE Bubble Style
            if (!conv.messages || conv.messages.length === 0) {
                container.innerHTML = '<div class="empty-state">ยังไม่มีประวัติข้อความ</div>';
                return;
            }

            container.innerHTML = conv.messages.map(m => {
                const isAgent = m.sender === 'agent';
                if (isAgent) {
                    return `
                        <div class="msg-row agent">
                            <div class="msg-content-flex">
                                <div class="msg-bubble">${escapeHtml(m.text)}</div>
                                <div class="msg-meta">
                                    <span class="msg-read-status">อ่านแล้ว</span>
                                    <span>${formatMsgTime(m.time)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="msg-row customer">
                            <img class="msg-avatar" src="${conv.customer_avatar || 'https://via.placeholder.com/100'}">
                            <div class="msg-bubble-wrap">
                                <span class="msg-customer-name">${escapeHtml(conv.customer_name)}</span>
                                <div class="msg-content-flex">
                                    <div class="msg-bubble">${escapeHtml(m.text)}</div>
                                    <div class="msg-meta">
                                        <span>${formatMsgTime(m.time)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = (input.value || '').trim();
            if (!text || !activeConvId) return;

            input.value = '';

            try {
                await fetch('/api/send-reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversation_id: activeConvId,
                        message: text
                    })
                });
                await loadData();
            } catch (err) {
                console.error('Send error:', err);
            }
        }

        async function saveCustomerName() {
            if (!activeConvId) return;
            const input = document.getElementById('edit-customer-name');
            const newName = (input.value || '').trim();
            if (!newName) return;
            await applyNameChange(newName);
        }

        async function saveMobileCustomerName() {
            if (!activeConvId) return;
            const input = document.getElementById('m-edit-customer-name');
            const newName = (input.value || '').trim();
            if (!newName) return;
            await applyNameChange(newName);
            closeCrmModal();
        }

        async function applyNameChange(newName) {
            try {
                await fetch('/api/update-customer-name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversation_id: activeConvId,
                        new_name: newName
                    })
                });
                const conv = allConversations.find(c => c.id === activeConvId);
                if (conv) {
                    conv.customer_name = newName;
                    document.getElementById('header-name').innerText = newName;
                    document.getElementById('crm-name').innerText = newName;
                    document.getElementById('m-crm-name').innerText = newName;
                    renderChats();
                }
            } catch (err) {
                console.error('Error saving customer name:', err);
            }
        }

        function promptEditName() {
            if (!activeConvId) return;
            const conv = allConversations.find(c => c.id === activeConvId);
            const current = conv ? conv.customer_name : '';
            const newName = prompt('แก้ไขชื่อลูกค้า / บันทึกชื่อเล่น:', current);
            if (newName && newName.trim() && newName.trim() !== current) {
                applyNameChange(newName.trim());
            }
        }

        async function togglePinActiveChat() {
            if (!activeConvId) return;
            try {
                const res = await fetch(`/api/conversations/${activeConvId}/pin`, { method: 'POST' });
                const data = await res.json();
                const conv = allConversations.find(c => c.id === activeConvId);
                if (conv) conv.is_pinned = data.is_pinned ? 1 : 0;
                await loadData();
            } catch (err) {
                console.error('Error toggling pin:', err);
            }
        }

        async function deleteActiveChat() {
            if (!activeConvId) return;
            const conv = allConversations.find(c => c.id === activeConvId);
            const customerName = conv ? conv.customer_name : 'ลูกค้ารายนี้';
            if (!confirm(`คุณต้องการลบห้องแชทของ "${customerName}" ใช่หรือไม่?\n(ข้อความการสนทนาทั้งหมดจะถูกลบถาวร)`)) {
                return;
            }
            try {
                await fetch(`/api/conversations/${activeConvId}`, { method: 'DELETE' });
                activeConvId = null;
                if (isMobile()) goBackToList();
                closeCrmModal();
                await loadData();
            } catch (err) {
                console.error('Error deleting conversation:', err);
            }
        }


        // Mobile CRM Modal controls
        function openCrmModal() {
            document.getElementById('crm-modal').classList.add('open');
        }
        function closeCrmModal() {
            document.getElementById('crm-modal').classList.remove('open');
        }
        function closeModalOnBackdrop(e) {
            if (e.target.id === 'crm-modal') {
                closeCrmModal();
            }
        }

        // WhatsApp Modal Controls & Sync
        let waPollTimer = null;

        async function openWhatsAppModal() {
            document.getElementById('wa-modal').classList.add('open');
            renderWhatsAppModalLoading();
            await checkWhatsAppStatus(true);
            if (!waPollTimer) {
                waPollTimer = setInterval(() => checkWhatsAppStatus(false), 2000);
            }
        }

        function closeWhatsAppModal() {
            document.getElementById('wa-modal').classList.remove('open');
            if (waPollTimer) {
                clearInterval(waPollTimer);
                waPollTimer = null;
            }
        }

        function closeWaModalOnBackdrop(e) {
            if (e.target.id === 'wa-modal') {
                closeWhatsAppModal();
            }
        }

        function renderWhatsAppModalLoading() {
            const body = document.getElementById('wa-modal-body');
            body.innerHTML = `
                <div style="padding: 30px; color: #94a3b8;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: #25D366; margin-bottom: 12px;"></i>
                    <div style="font-size: 14px;">กำลังโหลดสถานะ WhatsApp...</div>
                </div>
            `;
        }

        async function checkWhatsAppStatus(forceStart = false) {
            try {
                if (forceStart) {
                    fetch('/api/whatsapp/start', { method: 'POST' }).catch(() => {});
                }
                const res = await fetch('/api/whatsapp/status');
                const st = await res.json();
                
                // Update header status dot
                const dot = document.getElementById('wa-status-dot');
                if (dot) {
                    dot.style.background = st.is_connected ? '#25D366' : (st.qr_data_url ? '#f59e0b' : '#94a3b8');
                    dot.title = st.is_connected ? 'WhatsApp: เชื่อมต่อแล้ว' : (st.qr_data_url ? 'WhatsApp: รอสแกน QR' : 'WhatsApp: ออฟไลน์');
                }

                // If modal is open, render state
                const modal = document.getElementById('wa-modal');
                if (!modal.classList.contains('open')) return;

                const body = document.getElementById('wa-modal-body');

                if (st.is_connected) {
                    body.innerHTML = `
                        <div style="padding: 16px 10px;">
                            <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(37, 211, 102, 0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #25D366; font-size: 32px; border: 2px solid #25D366;">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div style="font-size: 18px; font-weight: 700; color: white;">เชื่อมต่อ WhatsApp สำเร็จแล้ว!</div>
                            <div style="font-size: 14px; color: #25D366; margin-top: 6px; font-weight: 600;">
                                เบอร์โทร: +${st.user_phone || 'WhatsApp Account'}
                            </div>
                            <div style="margin-top: 14px; font-size: 13px; color: #94a3b8; line-height: 1.6; background: rgba(0,0,0,0.25); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-line); text-align: left;">
                                <i class="fa-solid fa-bell" style="color: #25D366; margin-right: 6px;"></i>
                                เมื่อมีลูกค้าทักเข้ามาใน WhatsApp ข้อความจะเด้งเข้ามาในกล่องแชทรวมนี้ทันที และคุณสามารถพิมพ์ตอบกลับได้โดยตรง
                            </div>
                            <button onclick="closeWhatsAppModal()" style="margin-top: 20px; width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;">
                                เรียบร้อย ปิดหน้าต่าง
                            </button>
                        </div>
                    `;
                } else if (st.qr_data_url) {
                    body.innerHTML = `
                        <div>
                            <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 14px; text-align: left; line-height: 1.6; background: rgba(255,255,255,0.04); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-line);">
                                <span style="font-weight: 700; color: #25D366; display: block; margin-bottom: 4px;">วิธีเชื่อมต่อ WhatsApp:</span>
                                1. เปิดแอป <b>WhatsApp</b> ในมือถือของคุณ<br>
                                2. ไปที่ <b>การตั้งค่า (Settings)</b> &gt; <b>อุปกรณ์ที่เชื่อมโยง (Linked Devices)</b><br>
                                3. กด <b>เชื่อมโยงอุปกรณ์ (Link a Device)</b> แล้วสแกน QR Code ด้านล่างนี้
                            </div>
                            <div style="background: white; padding: 14px; border-radius: 16px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                                <img src="${st.qr_data_url}" style="width: 220px; height: 220px; display: block; border-radius: 4px;" alt="WhatsApp QR Code">
                            </div>
                            <div style="font-size: 12px; color: #94a3b8; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <i class="fa-solid fa-spinner fa-spin" style="color: #25D366;"></i> กำลังรอการสแกนจากมือถือ...
                            </div>
                        </div>
                    `;
                } else {
                    body.innerHTML = `
                        <div style="padding: 30px; color: #94a3b8;">
                            <i class="fa-solid fa-qrcode fa-spin" style="font-size: 32px; color: #25D366; margin-bottom: 12px;"></i>
                            <div style="font-size: 14px; font-weight: 600; color: white;">กำลังสร้าง QR Code...</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 6px;">โปรดรอสักครู่ ระบบกำลังเริ่มการเชื่อมต่อ WhatsApp</div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error fetching WA status:', err);
            }
        }

        // Audio Notification System (Web Audio API - Crisp chime sound)
        let audioCtx = null;
        function playNotificationSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                // Dual chime tone (880Hz -> 1174.66Hz)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                osc1.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.35);

                // Second tone for sparkle
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1318.51, now + 0.08);
                gain2.gain.setValueAtTime(0.2, now + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.4);

                if (window.navigator.vibrate) {
                    window.navigator.vibrate([100, 50, 100]);
                }
            } catch (e) {
                console.log('Audio notify error:', e);
            }
        }

        // Register Service Worker for Mobile PWA Push / Lock-screen Notifications
        let swReg = null;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').then(reg => {
                swReg = reg;
                console.log('Service Worker registered successfully');
            }).catch(err => {
                console.log('SW registration failed:', err);
            });
        }

        function triggerSystemNotification(title, body) {
            playNotificationSound();
            if (window.Notification && Notification.permission === 'granted') {
                if (swReg && swReg.showNotification) {
                    swReg.showNotification(title, {
                        body: body,
                        icon: '/static/icons/icon-192.png',
                        badge: '/static/icons/icon-192.png',
                        vibrate: [200, 100, 200, 100, 200],
                        tag: 'chat-msg',
                        renotify: true
                    });
                } else {
                    new Notification(title, {
                        body: body,
                        icon: '/static/icons/icon-192.png'
                    });
                }
            }
        }

        // Request browser notification permission on user interaction
        function enableNotifications() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
            // ส่งเสียงทดสอบ
            playNotificationSound();

            const btn = document.getElementById('btn-notify-perm');

            // ตรวจสอบว่ารองรับ Notification หรือไม่
            if (!('Notification' in window)) {
                alert('อุปกรณ์หรือเบราว์เซอร์นี้ยังไม่เปิดการแจ้งเตือนแบบป็อปอัป\n\nสำหรับ iPhone: ให้กดปุ่ม "แชร์" ด้านล่างของ Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)" จากนั้นเปิดผ่านไอคอนบนหน้าจอโฮมครับ');
                return;
            }

            if (Notification.permission === 'granted') {
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-bell"></i> เปิดแล้ว';
                    btn.style.color = '#8cb88b';
                    btn.style.borderColor = 'rgba(88, 129, 87, 0.4)';
                }
                triggerSystemNotification('ทดสอบการแจ้งเตือน!', 'ระบบแจ้งเตือนทำงานปกติแล้วครับ 🔔');
                alert('ระบบเปิดการแจ้งเตือนอยู่แล้วครับ! (ทดสอบส่งข้อความแจ้งเตือนเรียบร้อยแล้ว)');
                return;
            }

            const onPermissionResult = (perm) => {
                if (perm === 'granted') {
                    if (btn) {
                        btn.innerHTML = '<i class="fa-solid fa-bell"></i> เปิดแล้ว';
                        btn.style.color = '#8cb88b';
                        btn.style.borderColor = 'rgba(88, 129, 87, 0.4)';
                    }
                    triggerSystemNotification('เปิดแจ้งเตือนสำเร็จ!', 'ระบบจะส่งเสียงและเด้งเตือนเมื่อมีลูกค้าทักเข้ามาครับ');
                    alert('เปิดการแจ้งเตือนสำเร็จแล้ว! ระบบจะส่งเสียงและเด้งเตือนเมื่อมีลูกค้าทักเข้ามาครับ');
                } else if (perm === 'denied') {
                    alert('การแจ้งเตือนถูกปิดกั้นอยู่ โปรดเปิดอนุญาตใน:\nการตั้งค่า iPhone > Safari (หรือ OmniChat) > การแจ้งเตือน > อนุญาต');
                }
            };

            try {
                const req = Notification.requestPermission(onPermissionResult);
                if (req && req.then) {
                    req.then(onPermissionResult);
                }
            } catch (err) {
                try {
                    Notification.requestPermission(onPermissionResult);
                } catch (e2) {
                    alert('ไม่สามารถเรียกขอสิทธิ์แจ้งเตือนได้: ' + e2);
                }
            }
        }

        document.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        // Setup WebSocket for realtime auto-sync
        let lastKnownMsgCount = 0;
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => {
                console.log('Realtime WebSocket connected');
            };
            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'whatsapp_status') {
                        checkWhatsAppStatus(false);
                    } else if (data.type === 'incoming_customer_message') {
                        const mText = data.message ? data.message.text : 'ส่งข้อความใหม่เข้ามา';
                        triggerSystemNotification('มีลูกค้าทักเข้ามาใหม่!', mText);
                    }
                } catch (e) {}
                await loadData(true);
            };
            ws.onclose = () => {
                setTimeout(connectWS, 2000);
            };
        }

        // Auto polling fallback (every 3 seconds) to guarantee real-time even if WebSocket temporarily disconnects
        setInterval(async () => {
            try {
                const res = await fetch('/api/conversations');
                const newData = await res.json();
                let totalMsgs = 0;
                newData.forEach(c => totalMsgs += (c.messages ? c.messages.length : 0));
                
                // If new messages arrived
                if (lastKnownMsgCount > 0 && totalMsgs > lastKnownMsgCount) {
                    triggerSystemNotification('มีลูกค้าทักเข้ามาใหม่!', 'มีข้อความใหม่เข้ามาในระบบ');
                }
                lastKnownMsgCount = totalMsgs;
                
                // Only re-render if data changed
                if (JSON.stringify(newData) !== JSON.stringify(allConversations)) {
                    allConversations = newData;
                    renderChats();
                    renderMessages();
                }
            } catch (e) {}
        }, 3000);

        // Handle browser resize
        window.addEventListener('resize', () => {
            if (!isMobile()) {
                document.body.classList.remove('in-chat-mobile');
            }
        });

        // Initialize immediately
        connectWS();
        loadData();
        checkWhatsAppStatus(false);
    </script>

</body>
